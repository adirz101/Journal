# Unsigned packaging builds. Manual runs upload workflow artifacts only. A
# pushed v* tag also creates a DRAFT GitHub pre-release with the artifacts and
# SHA256SUMS for a maintainer to review and publish by hand. Nothing is signed
# or notarized (BLOCKED on certificates); see docs/RELEASING.md.
name: Package (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  JOURNAL_CI: '1'
  # No signing identities or secrets are used.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The dist script passes --publish never; electron-builder.yml also sets publish: null.
      - run: npm run dist

      - name: Checksums
        shell: bash
        run: |
          cd release
          files=$(ls *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null || true)
          if command -v sha256sum >/dev/null; then sha256sum $files > SHA256SUMS-${{ runner.os }}.txt; else shasum -a 256 $files > SHA256SUMS-${{ runner.os }}.txt; fi

      - uses: actions/upload-artifact@v4
        with:
          name: journal-unsigned-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: draft pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft pre-release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --prerelease \
            --title "Journal $GITHUB_REF_NAME (unsigned alpha)" --notes-file .github/release-notes-template.md
