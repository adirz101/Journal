# Release pipeline. A pushed v* tag builds, verifies and smoke-tests Journal on
# native hosted runners and creates a DRAFT GitHub Release with the installers,
# SHA256SUMS.txt and THIRD-PARTY-NOTICES.txt. A maintainer reviews and publishes
# it by hand. Manual runs (workflow_dispatch) build and test without releasing.
#
# Signing is optional and never faked (see docs/RELEASING.md). Without secrets:
# macOS builds are ad-hoc signed and not notarized; Windows builds are unsigned.
# Fixture CLIs only: no Claude Code, Codex or Cursor logins or provider requests.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JOURNAL_CI: '1'
  JOURNAL_HEADLESS: '1'

jobs:
  verify:
    name: verify (tests, tag and version)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
      - run: node scripts/release-check.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run test:desktop

  macos:
    name: package macOS (arm64)
    needs: verify
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Signing credentials (optional)
        id: signing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; fi
          if [ -n "$APPLE_API_KEY_P8" ]; then printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"; echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"; fi
      - name: Package
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:mac
      - name: Expected artifacts only
        run: node scripts/release-check.mjs --artifacts release --platform mac ${{ startsWith(github.ref, 'refs/tags/') && format('--tag {0}', github.ref_name) || '' }}
      - name: Package audit
        run: node scripts/package-audit.mjs release/mac-arm64/Journal.app
      - name: Smoke test the app from the DMG
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mnt="$RUNNER_TEMP/dmg"; mkdir -p "$mnt" "$RUNNER_TEMP/Install Dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "release/Journal-$version-arm64.dmg"
          test -L "$mnt/Applications" && test -d "$mnt/Journal.app"
          ditto "$mnt/Journal.app" "$RUNNER_TEMP/Install Dir/Journal.app"
          hdiutil detach "$mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/Install Dir/Journal.app"
          node scripts/smoke-packaged.mjs "$RUNNER_TEMP/Install Dir/Journal.app/Contents/MacOS/Journal"
      - name: Gatekeeper and notarization (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        run: |
          spctl -a -vv release/mac-arm64/Journal.app
          if [ -n "${APPLE_API_KEY:-}" ]; then xcrun stapler validate release/mac-arm64/Journal.app; fi
      - uses: actions/upload-artifact@v4
        with:
          name: journal-macos
          path: |
            release/Journal-*-arm64.dmg
            release/Journal-*-arm64.zip
          if-no-files-found: error
          retention-days: 3 # hand-off to the release job only; downloads come from GitHub Releases

  windows:
    name: package Windows (x64)
    needs: verify
    runs-on: windows-latest
    env:
      # Git Bash would rewrite the installer's /S switch into a path.
      MSYS_NO_PATHCONV: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Package
        env:
          # Optional Authenticode certificate; unsigned when empty.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Expected artifacts only
        run: node scripts/release-check.mjs --artifacts release --platform win ${{ startsWith(github.ref, 'refs/tags/') && format('--tag {0}', github.ref_name) || '' }}
      - name: Package audit
        run: node scripts/package-audit.mjs release/win-unpacked
      - name: Install per user without administrator rights, then smoke test
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          ./release/"Journal-Setup-$version-x64.exe" /S
          exe="$LOCALAPPDATA/Programs/Journal/Journal.exe"
          for i in $(seq 1 60); do [ -f "$exe" ] && break; sleep 2; done
          test -f "$exe"
          test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/Journal.lnk"
          node scripts/smoke-packaged.mjs "$exe"
      - name: Portable build runs from a folder with spaces and keeps data per user
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dir="$RUNNER_TEMP/Portable Test"; mkdir -p "$dir"
          cp release/"Journal-Portable-$version-x64.exe" "$dir/"
          marker="$RUNNER_TEMP/portable.json"
          JOURNAL_SMOKE_MARKER="$marker" JOURNAL_QUIT_POLICY=stop JOURNAL_HEADLESS=1 "$dir/Journal-Portable-$version-x64.exe" &
          for i in $(seq 1 90); do [ -s "$marker" ] && break; sleep 2; done
          cat "$marker"
          node -e "const m=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const v=require('./package.json').version;if(!m.packaged||m.version!==v||!/journal-desktop$/i.test(m.userData)||/Portable Test/.test(m.userData))process.exit(1)" "$marker"
          test -d "$APPDATA/journal-desktop"
      - name: Uninstall keeps Journal data
        run: |
          set -euo pipefail
          "$LOCALAPPDATA/Programs/Journal/Uninstall Journal.exe" /S
          for i in $(seq 1 60); do [ ! -f "$LOCALAPPDATA/Programs/Journal/Journal.exe" ] && break; sleep 2; done
          test ! -f "$LOCALAPPDATA/Programs/Journal/Journal.exe"
          test -d "$APPDATA/journal-desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: journal-windows
          path: |
            release/Journal-Setup-*-x64.exe
            release/Journal-Portable-*-x64.exe
          if-no-files-found: error
          retention-days: 3

  release:
    name: draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Notices and checksums
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
          cp THIRD_PARTY_NOTICES.md assets/THIRD-PARTY-NOTICES.txt
          node scripts/checksums.mjs assets "Journal-$version-arm64.dmg" "Journal-$version-arm64.zip" "Journal-Setup-$version-x64.exe" "Journal-Portable-$version-x64.exe" THIRD-PARTY-NOTICES.txt
          (cd assets && sha256sum -c SHA256SUMS.txt)
          ls -la assets
      - name: Create draft release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          prerelease=$(node -p "require('./package.json').version.includes('-') ? '--prerelease' : ''")
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag \
            --title "Journal $version" --notes-file .github/release-notes-template.md \
            "assets/Journal-$version-arm64.dmg" "assets/Journal-$version-arm64.zip" \
            "assets/Journal-Setup-$version-x64.exe" "assets/Journal-Portable-$version-x64.exe" \
            assets/SHA256SUMS.txt assets/THIRD-PARTY-NOTICES.txt
