name: Bug report
description: Something in Journal does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security vulnerabilities, use private reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Journal commit or version
      description: Output of `git rev-parse --short HEAD`, or the version you ran.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.4, Windows 11 24H2, Ubuntu 24.04
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: output of `node -v`
    validations:
      required: true
  - type: input
    id: cli-versions
    attributes:
      label: Claude Code / Codex versions
      description: Output of `claude --version` and/or `codex --version`, or "not involved".
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        **Remove secrets before pasting.** Do not include tokens, credentials, or terminal output that contains private code, prompts or data.
      render: text
