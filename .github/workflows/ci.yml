# Fixture-only CI. It never uses real Claude Code or Codex logins, provider
# requests or secrets. Native provider trials stay manual and local.
# Journal targets macOS and Windows; Linux was dropped from CI on 5 October 2026.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JOURNAL_CI: '1'

jobs:
  # Unit tests, type check and build: once per OS.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall downloads Electron and rebuilds node-pty for Electron.
      # On Windows this uses the Visual Studio toolchain on windows-latest.
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  # The desktop suite, split by spec file across parallel jobs (Playwright --shard). Each job
  # builds the renderer it loads (vite build takes seconds); the unit job verifies the build.
  desktop:
    name: desktop (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    # A hung desktop run fails here instead of holding a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, shard: 1, shards: 2 }
          - { os: macos-latest, shard: 2, shards: 2 }
          # POSIX fixture CLIs skip on Windows, so one job runs the few Windows specs.
          - { os: windows-latest, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Desktop tests (macOS)
        if: runner.os == 'macOS'
        run: npm run test:desktop -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

      # Windows desktop support is experimental, so failures here do not fail the run.
      - name: Desktop tests (Windows, experimental)
        id: windows-desktop
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run test:desktop -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

      # Also when the experimental Windows step failed (continue-on-error hides it from failure()).
      - name: Upload Playwright results
        if: failure() || steps.windows-desktop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
