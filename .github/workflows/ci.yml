# Fixture-only CI. It never uses real Claude Code or Codex logins, provider
# requests or secrets. Native provider trials stay manual and local.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JOURNAL_CI: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node-pty builds with build-essential/python3 (preinstalled). Electron needs
      # these shared libraries, and xvfb provides a display for headless runs.
      - name: Install Linux Electron dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libgtk-3-0 libgbm1 libxss1 libxtst6 xvfb
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      # postinstall downloads Electron and rebuilds node-pty for Electron.
      # On Windows this uses the Visual Studio toolchain on windows-latest.
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Desktop tests (macOS)
        if: runner.os == 'macOS'
        run: npm run test:desktop

      - name: Desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

      # POSIX fixture CLIs skip on Windows, and Windows desktop support is
      # experimental, so failures here do not fail the run.
      - name: Desktop tests (Windows, experimental)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run test:desktop

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
