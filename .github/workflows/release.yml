# Release pipeline. A pushed v* tag builds, verifies and smoke-tests Journal on
# native hosted runners and creates a DRAFT GitHub Release with the installers,
# SHA256SUMS.txt and THIRD-PARTY-NOTICES.txt. A maintainer reviews and publishes
# it by hand. Manual runs and pull requests that change packaging build and
# test without releasing.
#
# Signing is never faked (see docs/RELEASING.md). Tag releases require the macOS
# signing secrets (updates need a Developer ID signature); manual runs and pull
# requests without them are ad-hoc signed. Windows builds are unsigned.
# Fixture CLIs only: no Claude Code, Codex or Cursor logins or provider requests.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['electron-builder.config.cjs', 'package.json', 'package-lock.json', 'scripts/**', 'src/desktop/**', 'src/runtime/**', 'assets/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JOURNAL_CI: '1'
  JOURNAL_HEADLESS: '1'
  # The tag only through the environment, never pasted into scripts.
  TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  verify:
    name: verify (tests, tag and version)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Tag matches package.json
        if: env.TAG != ''
        run: node scripts/release-check.mjs --tag "$TAG"
      - run: node scripts/release-check.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build

  # The desktop suite in two parallel halves (Playwright --shard), beside verify.
  verify-desktop:
    name: verify desktop (${{ matrix.shard }}/2)
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run test:desktop -- --shard=${{ matrix.shard }}/2
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-test-results-${{ matrix.shard }}-of-2
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  macos:
    name: package macOS (arm64)
    needs: [verify, verify-desktop]
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 90 # notarization can take a while
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Signing credentials (optional)
        id: signing
        env:
          # Pull-request code is never signed with real certificates: only ad-hoc.
          APPLE_API_KEY_P8: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_KEY_P8 || '' }}
          MAC_CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -n "$MAC_CSC_LINK" ]; then
            # The certificate goes into a temporary keychain with its own random password.
            # (electron-builder's CSC_LINK import unlocks its keychain with the .p12 password,
            # which macOS refuses; so it gets a ready keychain and an identity name instead.)
            keychain="$RUNNER_TEMP/journal-signing.keychain-db"; kpass=$(openssl rand -hex 24); echo "::add-mask::$kpass"
            printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/journal-devid.p12"
            security create-keychain -p "$kpass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$kpass" "$keychain"
            security import "$RUNNER_TEMP/journal-devid.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/journal-devid.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)
            if [ -z "$identity" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
            echo "Signing as Developer ID Application: $identity"
            { echo "CSC_KEYCHAIN=$keychain"; echo "CSC_NAME=$identity"; } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # Released macOS builds must be Developer ID signed: Squirrel.Mac installs an
            # update only when it is signed like the running app, so an ad-hoc release
            # could never update itself (docs/RELEASING.md).
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "::error::Tag releases need the macOS signing secrets (automatic updates require a Developer ID signature)"; exit 1; fi
            # Without a certificate the app is only ad-hoc signed; electron-builder would skip even
            # that for pull requests, leaving a broken signature (CSC_FOR_PULL_REQUEST keeps it).
            echo "signed=false" >> "$GITHUB_OUTPUT"; echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"; echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"; fi
      - name: Package
        env:
          APPLE_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          # Signing uses CSC_NAME and CSC_KEYCHAIN from the previous step; no certificate path.
          unset CSC_LINK CSC_KEY_PASSWORD
          npm run dist:mac
      - name: Expected artifacts only
        run: node scripts/release-check.mjs --artifacts release --platform mac ${TAG:+--tag "$TAG"}
      - name: Package audit
        run: node scripts/package-audit.mjs release/mac-arm64/Journal.app
      - name: Smoke test the app from the DMG
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mnt="$RUNNER_TEMP/dmg"; mkdir -p "$mnt" "$RUNNER_TEMP/Install Dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "release/Journal-$version-arm64.dmg"
          test -L "$mnt/Applications" && test -d "$mnt/Journal.app"
          ditto "$mnt/Journal.app" "$RUNNER_TEMP/Install Dir/Journal.app"
          hdiutil detach "$mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/Install Dir/Journal.app"
          node scripts/smoke-packaged.mjs "$RUNNER_TEMP/Install Dir/Journal.app/Contents/MacOS/Journal"
          # The ZIP holds the same, validly signed app.
          mkdir -p "$RUNNER_TEMP/zip" && ditto -x -k "release/Journal-$version-arm64.zip" "$RUNNER_TEMP/zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/zip/Journal.app"
      - name: Gatekeeper and notarization (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        run: |
          spctl -a -vv release/mac-arm64/Journal.app
          if [ -n "${APPLE_API_KEY:-}" ]; then xcrun stapler validate release/mac-arm64/Journal.app; fi
      - name: Remove signing material
        if: always()
        run: |
          [ -n "${CSC_KEYCHAIN:-}" ] && security delete-keychain "$CSC_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/journal-devid.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: journal-macos
          path: |
            release/Journal-*-arm64.dmg
            release/Journal-*-arm64.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 3 # hand-off to the release job only; downloads come from GitHub Releases

  windows:
    name: package Windows (x64)
    needs: [verify, verify-desktop]
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      # Git Bash would rewrite the installer's /S switch into a path.
      MSYS_NO_PATHCONV: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Package
        env:
          # Optional Authenticode certificate; unsigned when empty.
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run dist:win
      - name: Expected artifacts only
        run: node scripts/release-check.mjs --artifacts release --platform win ${TAG:+--tag "$TAG"}
      - name: Package audit
        run: node scripts/package-audit.mjs release/win-unpacked
      - name: Install per user without administrator rights, then smoke test
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          ./release/"Journal-Setup-$version-x64.exe" /S
          exe="$LOCALAPPDATA/Programs/journal-desktop/Journal.exe"
          for i in $(seq 1 60); do [ -f "$exe" ] && break; sleep 2; done
          test -f "$exe"
          test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/Journal.lnk"
          node scripts/smoke-packaged.mjs "$exe"
      - name: Installed app uses the per-user data folder
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/installed.json"
          check() { node -e "const m=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const v=require('./package.json').version;if(!m.packaged||m.version!==v||m.runtime!=='connected'||!/journal-desktop$/i.test(m.userData)||/Programs|Portable Test/i.test(m.userData)){console.error(m);process.exit(1)}" "$1"; }
          JOURNAL_SMOKE_MARKER="$marker" JOURNAL_QUIT_POLICY=stop "$LOCALAPPDATA/Programs/journal-desktop/Journal.exe" > /dev/null 2>&1 &
          for i in $(seq 1 90); do [ -s "$marker" ] && break; sleep 2; done
          cat "$marker"; check "$marker"
          test -d "$APPDATA/journal-desktop"
      - name: Uninstall keeps Journal data
        run: |
          set -euo pipefail
          taskkill /IM Journal.exe /F > /dev/null 2>&1 || true
          "$LOCALAPPDATA/Programs/journal-desktop/Uninstall Journal.exe" /S
          for i in $(seq 1 60); do [ ! -f "$LOCALAPPDATA/Programs/journal-desktop/Journal.exe" ] && break; sleep 2; done
          test ! -f "$LOCALAPPDATA/Programs/journal-desktop/Journal.exe"
          test -f "$APPDATA/journal-desktop/journal.sqlite"
      - name: Portable build runs from a folder with spaces and keeps data per user
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dir="$RUNNER_TEMP/Portable Test"; mkdir -p "$dir"
          cp release/"Journal-Portable-$version-x64.exe" "$dir/"
          marker="$RUNNER_TEMP/portable.json"
          JOURNAL_SMOKE_MARKER="$marker" JOURNAL_QUIT_POLICY=stop "$dir/Journal-Portable-$version-x64.exe" > /dev/null 2>&1 &
          for i in $(seq 1 90); do [ -s "$marker" ] && break; sleep 2; done
          if [ ! -s "$marker" ]; then taskkill /IM Journal.exe /F || true; echo "The portable build did not report in time"; exit 1; fi
          cat "$marker"
          node -e "const m=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const v=require('./package.json').version;if(!m.packaged||m.version!==v||m.runtime!=='connected'||!/journal-desktop$/i.test(m.userData)||/Portable Test/.test(m.userData)){console.error(m);process.exit(1)}" "$marker"
          test ! -e "$dir/journal-desktop"
      - name: Stop leftover processes
        if: always()
        run: taskkill /IM Journal.exe /F > /dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: journal-windows
          path: |
            release/Journal-Setup-*-x64.exe
            release/Journal-Portable-*-x64.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  release:
    name: draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          pattern: journal-*
          merge-multiple: true
      - name: Notices and checksums
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/release-check.mjs --tag "$TAG"
          cp THIRD_PARTY_NOTICES.md dist-assets/THIRD-PARTY-NOTICES.txt
          # Installed copies update from latest-mac.yml / latest.yml and the blockmaps.
          test -f dist-assets/latest-mac.yml && test -f dist-assets/latest.yml
          blockmaps=$(cd dist-assets && ls *.blockmap 2>/dev/null || true)
          node scripts/checksums.mjs dist-assets "Journal-$version-arm64.dmg" "Journal-$version-arm64.zip" "Journal-Setup-$version-x64.exe" "Journal-Portable-$version-x64.exe" THIRD-PARTY-NOTICES.txt latest-mac.yml latest.yml $blockmaps
          (cd dist-assets && sha256sum -c SHA256SUMS.txt)
          ls -la dist-assets
      - name: Create draft release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          prerelease=$(node -p "require('./package.json').version.includes('-') ? '--prerelease' : ''")
          sed "s/<version>/$version/g" .github/release-notes-template.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft $prerelease --verify-tag \
            --title "Journal $version" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist-assets/Journal-$version-arm64.dmg" "dist-assets/Journal-$version-arm64.zip" \
            "dist-assets/Journal-Setup-$version-x64.exe" "dist-assets/Journal-Portable-$version-x64.exe" \
            dist-assets/SHA256SUMS.txt dist-assets/THIRD-PARTY-NOTICES.txt dist-assets/latest-mac.yml dist-assets/latest.yml dist-assets/*.blockmap
